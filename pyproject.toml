[project]
name = "dibs"
version = "0.1.0"
description = "Windows computer-use hub: one machine, many agents. HTTP + MCP, agent registration, exclusive input lease, audit log, dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "mss>=9.0",
  "pillow>=10.0",
  "pyautogui>=0.9.54",
  "pywin32>=306; sys_platform == 'win32'",
  "pynput>=1.7.7",
  "mcp>=1.10,<2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.50"]
agent = ["anthropic>=0.50"]

[project.scripts]
dibs = "dibs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dibs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["display: needs a real Windows desktop"]
